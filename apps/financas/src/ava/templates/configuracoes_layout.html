{% extends "base.html" %}

{% block content %}
<div class="mb-6">
  <h1 class="text-2xl font-bold text-ink mb-1">Configurações</h1>
  <p class="text-sm text-muted">Faça a gestão de todo o seu património, contas e estrutura de finanças.</p>
</div>

<div class="mb-6 border-b border-border">
  <nav class="flex gap-6 -mb-px overflow-x-auto">
    <a href="/configuracoes/titulares" class="pb-2 text-sm font-medium border-b-2 transition-colors whitespace-nowrap {% if request.url.path == '/configuracoes/titulares' %}border-ink text-ink{% else %}border-transparent text-muted hover:border-border hover:text-ink{% endif %}">
      Titulares
    </a>
    <a href="/configuracoes/patrimonio" class="pb-2 text-sm font-medium border-b-2 transition-colors whitespace-nowrap {% if request.url.path == '/configuracoes/patrimonio' %}border-ink text-ink{% else %}border-transparent text-muted hover:border-border hover:text-ink{% endif %}">
      Património
    </a>
    <a href="/configuracoes/categorias" class="pb-2 text-sm font-medium border-b-2 transition-colors whitespace-nowrap {% if request.url.path == '/configuracoes/categorias' %}border-ink text-ink{% else %}border-transparent text-muted hover:border-border hover:text-ink{% endif %}">
      Categorias
    </a>
    <a href="/configuracoes/orcamentos" class="pb-2 text-sm font-medium border-b-2 transition-colors whitespace-nowrap {% if request.url.path == '/configuracoes/orcamentos' %}border-ink text-ink{% else %}border-transparent text-muted hover:border-border hover:text-ink{% endif %}">
      Orçamentos
    </a>
    <a href="/rendimentos-recorrentes/novo" class="pb-2 text-sm font-medium border-b-2 transition-colors whitespace-nowrap {% if request.url.path == '/rendimentos-recorrentes/novo' %}border-ink text-ink{% else %}border-transparent text-muted hover:border-border hover:text-ink{% endif %}">
      Recorrentes
    </a>
  </nav>
</div>

<div>
  {% block config_content %}{% endblock %}
</div>
{% endblock %}
