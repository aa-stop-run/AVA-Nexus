<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cyanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Escuro Stark HUD -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.4" />

  <!-- Brilho Central -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" />

  <!-- Anéis Orbitais Concêntricos -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.6" />
  <circle cx="256" cy="256" r="135" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="60 20 10 20" stroke-opacity="0.8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="105" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.7" />

  <!-- Retículas e Marcas de Coordenadas -->
  <line x1="256" y1="65" x2="256" y2="85" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="427" x2="256" y2="447" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="65" y1="256" x2="85" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="427" y1="256" x2="447" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Triângulo Cibernético Central (Monograma AVA) -->
  <polygon points="256,150 180,310 332,310" fill="none" stroke="url(#cyanGold)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)" />
  <line x1="205" y1="265" x2="307" y2="265" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />

  <!-- Núcleo de Energia Nexus (Ponto Central) -->
  <circle cx="256" cy="235" r="12" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="256" cy="235" r="5" fill="#ffffff" />
</svg>
